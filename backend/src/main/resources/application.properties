spring.application.name=WifakBankProject

# ── Active profile (dev = embedded LDAP; remove or change for real AD) ───────
spring.profiles.active=dev

# ── Oracle DataSource ─────────────────────────────────────────────────────────
# C##wifak_platform = common user created in CDB root (XE).
# If you created the user inside XEPDB1 instead, use:
#   url=jdbc:oracle:thin:@//localhost:1521/XEPDB1  and  username=wifak_platform
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XE
spring.datasource.username=C##wifak_platform
spring.datasource.password=wifak123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Run data.sql AFTER Hibernate has created/updated tables
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ── Embedded LDAP (UnboundID – active only when profile=dev) ──────────────────
# Remove / comment these 3 lines when switching to a real AD server.
spring.ldap.embedded.base-dn=dc=wifakbank,dc=tn
spring.ldap.embedded.ldif=classpath:test-users.ldif
spring.ldap.embedded.port=8389

# ── AD / LDAP connection ──────────────────────────────────────────────────────
# DEV  → embedded server on localhost:8389 (profile=dev)
# PROD → point to real DC (profile=prod or remove spring.profiles.active=dev)
#         Two values to change, zero code changes needed.
app.ad.domain=wifakbank.tn
app.ad.url=ldap://localhost:8389/

# ── JWT ───────────────────────────────────────────────────────────────────────
# 64-byte Base64 key. Override via env-var APP_JWT_SECRET in production.
app.jwt.secret=V2lmYWtCYW5rU3VwZXJTZWNyZXRLZXkxMjM0NTY3ODkwQUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo=
app.jwt.expiration-ms=86400000

# ── CORS (Angular dev server) ─────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:4200

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
