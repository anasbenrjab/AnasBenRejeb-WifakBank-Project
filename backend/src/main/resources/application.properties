# Server Configuration
server.port=8082

# Oracle DataSource
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=C##dashboard_client_user
spring.datasource.password=dashboard_client_password

# JWT Configuration
# WARNING: hardcoded for local development only — use JWT_SECRET env var in production
app.jwt.secret=wifakbank-jwt-secret-key-for-testing-purposes-only-change-in-production
app.jwt.expiration-ms=86400000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# CORS — allow requests from Angular frontend and main portal
app.cors.allowed-origins=http://localhost:4200,http://localhost:4201
