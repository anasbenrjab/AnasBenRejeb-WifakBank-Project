<div class="page-header">
  <button class="btn btn-secondary" (click)="cancel()">← Retour</button>
  <h1 class="page-title">Ajouter un utilisateur</h1>
  <div></div>
</div>

@if (loading()) {
  <div class="state-container">
    <div class="spinner-large"></div>
    <p class="state-text">Chargement...</p>
  </div>
} @else {
  @if (errorMessage()) {
    <div class="alert alert-error">
      <span class="alert-icon">⚠</span>
      {{ errorMessage() }}
    </div>
  }

  <div class="card">
    <form [formGroup]="createForm" (ngSubmit)="saveCreate()" class="form-section">
      <div class="form-row">
        <div class="form-group">
          <label>Login</label>
          <input type="text" formControlName="login" class="form-input">
        </div>
        <div class="form-group">
          <label>Type d'authentification</label>
          <select formControlName="authType" class="form-input">
            <option value="AD">AD / LDAP</option>
            <option value="LOCAL">Local</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" formControlName="prenom" class="form-input">
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" formControlName="nom" class="form-input">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" class="form-input">
        </div>
        <div class="form-group">
          <label>Statut</label>
          <select formControlName="status" class="form-input">
            <option value="ACTIVE">Actif</option>
            <option value="INACTIVE">Inactif</option>
          </select>
        </div>
      </div>

      @if (createForm.value.authType === 'LOCAL') {
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" formControlName="password" class="form-input">
        </div>
      }

      <div class="form-group">
        <label>Rôle *</label>
        <select formControlName="roleId" class="form-input">
          <option [ngValue]="null">-- Sélectionner un rôle --</option>
          @for (role of roles(); track role.id) {
            <option [ngValue]="role.id">{{ role.nom }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label>Département</label>
        <select formControlName="departmentId" class="form-input" (change)="onDepartmentChange()">
        <option [ngValue]="null">Non assigné</option>
          @for (dept of departments(); track dept.id) {
            <option [ngValue]="dept.id">{{ getDepartmentName(dept) }}</option>
          }
        </select>
      </div>

      @if (subDepartments().length > 0) {
        <div class="form-group">
          <label>Sous-département</label>
          <select formControlName="subDepartmentId" class="form-input">
            <option [ngValue]="null">Non assigné</option>
            @for (subDept of subDepartments(); track subDept.id) {
              <option [ngValue]="subDept.id">{{ subDept.name }}</option>
            }
          </select>
        </div>
      }

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          @if (loading()) {
            Chargement...
          } @else {
            Enregistrer
          }
        </button>
      </div>
    </form>
  </div>
}
