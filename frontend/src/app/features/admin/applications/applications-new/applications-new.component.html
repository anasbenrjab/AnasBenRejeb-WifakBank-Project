<div class="page-header">
  <button class="btn btn-secondary" (click)="cancel()">← Retour</button>
  <h1 class="page-title">Ajouter une application</h1>
  <div></div>
</div>

@if (loading()) {
  <div class="state-container">
    <div class="spinner-large"></div>
    <p class="state-text">Chargement...</p>
  </div>
} @else {
  @if (errorMessage()) {
    <div class="alert alert-error">
      <span class="alert-icon">⚠</span>
      {{ errorMessage() }}
    </div>
  }

  <div class="card">
    <form [formGroup]="createForm" (ngSubmit)="saveCreate()" class="form-section">
      <div class="form-row">
        <div class="form-group">
          <label>Code</label>
          <input type="text" formControlName="code" class="form-input" />
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" formControlName="nom" class="form-input" />
        </div>
        <div class="form-group">
          <label>Statut</label>
          <select formControlName="status" class="form-input">
            <option value="ACTIVE">Actif</option>
            <option value="INACTIVE">Inactif</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>URL</label>
          <input type="text" formControlName="url" class="form-input" />
        </div>
        <div class="form-group">
          <label>Icon</label>
          <input type="text" formControlName="icon" class="form-input" />
        </div>
      </div>
      <div class="form-group">
        <label>Département</label>
        <select formControlName="departmentId" class="form-input">
          <option [ngValue]="null">Non assigné</option>
          @for (dept of departments(); track dept.id) {
            <option [ngValue]="dept.id">{{ getDepartmentName(dept) }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label>Rôles disponibles pour cette application</label>
        <div class="checkbox-grid">
          <!-- "Aucun rôle" shortcut — pure UI, sends empty roleIds to backend -->
          <label class="checkbox-item checkbox-item-none" [class.checked]="noRoleChecked">
            <input
              type="checkbox"
              [checked]="noRoleChecked"
              (change)="selectNoRole()"
            />
            <span class="checkbox-label-text">
              <span class="checkbox-title">Aucun rôle</span>
              <span class="checkbox-subtitle">Aucun accès spécifique requis</span>
            </span>
          </label>
          <div class="checkbox-divider"></div>
          @for (role of roles(); track role.id) {
            <label class="checkbox-item" [class.checked]="isRoleSelected(role.id)">
              <input
                type="checkbox"
                [checked]="isRoleSelected(role.id)"
                (change)="toggleRole(role.id)"
              />
              <span class="checkbox-label-text">
                <span class="checkbox-title">{{ role.nom }}</span>
                @if (role.description) {
                  <span class="checkbox-subtitle">{{ role.description }}</span>
                }
              </span>
            </label>
          }
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="description" class="form-input" rows="3"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          @if (loading()) { Chargement... } @else { Enregistrer }
        </button>
      </div>
    </form>
  </div>
}
