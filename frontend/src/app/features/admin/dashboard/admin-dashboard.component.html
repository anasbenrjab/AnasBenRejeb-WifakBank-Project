<div class="dashboard-container">
  
  <!-- ========== HERO HEADER ========== -->
  <div class="hero-section fade-in">
    <div class="hero-content">
      <div class="hero-left">
        <div class="greeting-badge">
          <i class="bi bi-shield-check"></i>
          Wifak Bank Administration
        </div>
        <h1 class="hero-title">
          Tableau de bord
        </h1>
        <p class="hero-subtitle">
          <i class="bi bi-calendar-event"></i>
          {{ currentDate | date:'EEEE, dd MMMM yyyy' }}
        </p>
      </div>
      <div class="hero-right">
      
      </div>
    </div>
  </div>

  <!-- ========== STATS GRID ========== -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats; let i = index"
         [style.animation-delay]="(i * 100) + 'ms'">
      <div class="stat-top">
        <div class="stat-icon-wrapper" [style.background]="stat.bgColor">
          <i [class]="stat.icon" [style.color]="stat.iconColor"></i>
        </div>
        <div class="stat-trend" [class]="stat.trend">
          <i class="bi" [class.bi-arrow-up]="stat.trend === 'up'"
                       [class.bi-arrow-down]="stat.trend === 'down'"></i>
          {{ stat.percentage }}%
        </div>
      </div>
      <div class="stat-value">{{ stat.value }}</div>
      <div class="stat-label">{{ stat.label }}</div>
      <div class="stat-progress" *ngIf="stat.progress">
        <div class="progress-bar" [style.width]="stat.progress + '%'"
             [style.background]="stat.bgColor"></div>
      </div>
    </div>
  </div>



  

</div>
