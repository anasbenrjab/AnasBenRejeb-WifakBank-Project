<div class="card">
  <div class="card-header">
    <h2 class="card-title">Nouveau Rôle</h2>
  </div>
  <div class="card-body">
    @if (errorMessage()) {
      <div class="alert alert-error">
        <span class="alert-icon">⚠</span>
        {{ errorMessage() }}
      </div>
    }
    <form [formGroup]="createForm" (ngSubmit)="saveCreate()">
      <div class="form-group">
        <label class="form-label">Nom</label>
        <input
          type="text"
          class="form-input"
          formControlName="nom"
          placeholder="Nom du rôle"
        />
        @if (createForm.get('nom')?.invalid && createForm.get('nom')?.touched) {
          <div class="form-error">Le nom est obligatoire</div>
        }
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea
          class="form-input"
          formControlName="description"
          placeholder="Description du rôle (optionnel)"
          rows="3"
        ></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-inline"></span>
          }
          Créer
        </button>
      </div>
    </form>
  </div>
</div>
