<div class="page-header">
  <button class="btn btn-secondary" (click)="cancel()">← Retour</button>
  <h1 class="page-title">Modifier le sous-département</h1>
  <div></div>
</div>

@if (loading()) {
  <div class="state-container">
    <div class="spinner-large"></div>
    <p class="state-text">Chargement...</p>
  </div>
} @else if (errorMessage()) {
  <div class="alert alert-error">
    <span class="alert-icon">⚠</span>
    {{ errorMessage() }}
  </div>
} @else {
  <div class="card">
    <form [formGroup]="editForm" (ngSubmit)="save()" class="form-section">
      <div class="form-row">
        <div class="form-group">
          <label>Département Parent</label>
          <select formControlName="departmentId" class="form-input">
            @for (dept of departments(); track dept.id) {
              <option [value]="dept.id">{{ dept.name }}</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" formControlName="name" class="form-input" />
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading()">Enregistrer</button>
      </div>
    </form>
  </div>
}
