<div class="card">
  <div class="card-header">
    <h2 class="card-title">Nouveau Sous-Département</h2>
  </div>
  <div class="card-body">
    @if (errorMessage()) {
      <div class="alert alert-error">
        <span class="alert-icon">⚠</span>
        {{ errorMessage() }}
      </div>
    }
    <form [formGroup]="createForm" (ngSubmit)="saveCreate()">
      <div class="form-group">
        <label class="form-label">Département Parent</label>
        <select formControlName="departmentId" class="form-input">
          <option value="">Sélectionner un département</option>
          @for (dept of departments(); track dept.id) {
            <option [value]="dept.id">{{ dept.name }}</option>
          }
        </select>
        @if (createForm.get('departmentId')?.invalid && createForm.get('departmentId')?.touched) {
          <div class="form-error">Le département est obligatoire</div>
        }
      </div>
      <div class="form-group">
        <label class="form-label">Nom</label>
        <input
          type="text"
          class="form-input"
          formControlName="name"
          placeholder="Nom du sous-département"
        />
        @if (createForm.get('name')?.invalid && createForm.get('name')?.touched) {
          <div class="form-error">Le nom est obligatoire</div>
        }
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-inline"></span>
          }
          Créer
        </button>
      </div>
    </form>
  </div>
</div>
