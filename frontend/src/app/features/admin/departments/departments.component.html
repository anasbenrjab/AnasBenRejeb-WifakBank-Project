<div class="page-header">
  <h1 class="page-title">Manage Departments</h1>
  <a class="btn btn-primary" routerLink="/admin/departments/new">
    <i class="bi bi-plus-lg mr-2"></i>
    Ajouter un département
  </a>
</div>

<!-- Filters -->
<div class="filters-container">
  <div class="search-box">
    <i class="bi bi-search search-icon"></i>
    <input
      type="text"
      placeholder="Rechercher par code ou nom..."
      class="search-input"
      [value]="searchQuery()"
      (input)="searchQuery.set($any($event.target).value)"
    />
  </div>
</div>

@if (loading()) {
  <div class="card">
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Nom</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (i of [1,2,3,4,5]; track i) {
            <tr>
              <td><div class="skeleton skeleton-text" style="width: 80px;"></div></td>
              <td><div class="skeleton skeleton-text" style="width: 200px;"></div></td>
              <td><div style="display: flex; gap: 8px;"><div class="skeleton" style="width: 36px; height: 36px;"></div><div class="skeleton" style="width: 36px; height: 36px;"></div></div></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
} @else if (errorMessage()) {
  <div class="alert alert-error">
    <span class="alert-icon">⚠</span>
    {{ errorMessage() }}
  </div>
} @else {
  <div class="card">
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Nom</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (dept of filteredDepartments(); track dept.id) {
            <tr>
              <td>{{ dept.code }}</td>
              <td>{{ dept.name }}</td>
              <td>
                <div class="actions-cell">
                  <button
                    class="btn-icon btn-secondary"
                    [routerLink]="['/admin/departments', dept.id, 'edit']"
                    title="Modifier"
                  >
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button
                    class="btn-icon btn-danger"
                    (click)="deleteDepartment(dept.id)"
                    title="Supprimer"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
}
